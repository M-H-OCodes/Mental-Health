<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Blog Dates</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4yI6s3vTszJu2av8OAHtsmBngqP4Apcs",
      authDomain: "fir-1-e84b8.firebaseapp.com",
      databaseURL: "https://fir-1-e84b8-default-rtdb.firebaseio.com",
      projectId: "fir-1-e84b8",
      storageBucket: "fir-1-e84b8.appspot.com",
      messagingSenderId: "655755862767",
      appId: "1:655755862767:web:291e6854036b1939a3b11a"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    function getRandomDateTimestamp(startDate, endDate) {
      const startTime = startDate.getTime();
      const endTime = endDate.getTime();
      return startTime + Math.floor(Math.random() * (endTime - startTime));
    }

    async function updateExistingBlogsDates() {
      const blogsRef = ref(database, 'blogs');
      const snapshot = await get(blogsRef);

      if (snapshot.exists()) {
        const data = snapshot.val();
        for (const userId in data) {
          for (const blogId in data[userId]) {
            const newTimestamp = getRandomDateTimestamp(new Date('2025-02-12'), new Date('2025-02-27'));
            const blogRef = ref(database, `blogs/${userId}/${blogId}`);
            await update(blogRef, { timestamp: newTimestamp });
            console.log(`Updated blog ${blogId} for user ${userId} to ${new Date(newTimestamp).toLocaleDateString()}`);
          }
        }
      } else {
        console.log("No blogs found.");
      }
    }
    updateExistingBlogsDates();
  </script>
</head>

<body>
  <h1>Updating blog dates...</h1>
  <p>Check the console for status messages.</p>
</body>
</html>
